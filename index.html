        tailwind.config = {

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            user-select: none;
        }
        .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        /* Custom animations */
        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(18deg); }
        }
        .animate-tail {
            animation: tailWag 0.35s infinite ease-in-out;
            transform-origin: bottom left;
        }
        @keyframes earTwitch {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(5deg); }
        }
        .animate-ear {
            animation: earTwitch 2.5s infinite;
        }
        @keyframes sniffBob {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(6px) rotate(-3deg); }
        }
        .animate-sniff {
            animation: sniffBob 0.6s infinite ease-in-out;
        }
        @keyframes zzzFloat {
            0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translate(15px, -25px) scale(1.2); }
        }
        .animate-zzz-1 { animation: zzzFloat 2.4s infinite ease-out; }
        .animate-zzz-2 { animation: zzzFloat 2.4s infinite ease-out 0.8s; }
        .animate-zzz-3 { animation: zzzFloat 2.4s infinite ease-out 1.6s; }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
